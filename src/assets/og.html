<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #FFFFFF;
    color: #16181A;
    font-family: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", sans-serif;
    letter-spacing: -0.02em;
    display: flex; flex-direction: column;
    padding: 76px 88px 68px;
    position: relative;
  }
  /* 왼쪽 끝 레일을 얇은 색 띠로 옮겨 놓는다 */
  /* 마크와 같은 파랑으로 맞춥니다. 한 그림 안에서 비슷한 파랑 두 개가 섞이면 사고로 보입니다. */
  .rail { position: absolute; left: 0; top: 0; bottom: 0; width: 14px; background: #3182F6; }

  .head { display: flex; align-items: center; gap: 16px; }
  /* 마크는 여백을 품고 있어 같은 크기에서 글자보다 작아 보입니다. 그만큼 키웁니다. */
  .mark { width: 66px; height: 66px; margin-left: -6px; }
  .host { font-family: "JetBrains Mono", monospace; font-size: 20px; color: #8B9099; letter-spacing: 0; }

  .body { margin-top: auto; }
  .eyebrow {
    font-family: "JetBrains Mono", monospace;
    font-size: 20px; font-weight: 500; letter-spacing: 0.12em; color: #1B64DA;
    margin-bottom: 22px;
  }
  h1 { font-size: 78px; font-weight: 600; line-height: 1.2; letter-spacing: -0.035em; }
  .lead { margin-top: 24px; font-size: 27px; line-height: 1.6; color: #545A64; letter-spacing: -0.015em; }

  .foot {
    margin-top: 46px; padding-top: 26px; border-top: 1px solid rgba(22,24,26,0.09);
    display: flex; align-items: baseline; justify-content: space-between;
    font-size: 21px; color: #8B9099;
  }
  .foot b { font-weight: 500; color: #545A64; }
</style>
</head>
<body>
  <span class="rail"></span>

  <div class="head">
    <!-- public/favicon.svg 와 같은 마크입니다. 한쪽만 고치면 탭과 미리보기가 어긋납니다. -->
    <svg class="mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <rect fill="#101317" x="6"  y="36" width="4" height="14" rx="1" />
      <rect fill="#101317" x="18" y="26" width="4" height="24" rx="1" />
      <rect fill="#101317" x="30" y="36" width="4" height="14" rx="1" />
      <rect fill="#3182F6" x="42" y="14" width="4" height="36" rx="1" />
      <rect fill="#101317" x="54" y="36" width="4" height="14" rx="1" />
    </svg>
    <span class="host">it.looksgood2.me</span>
  </div>

  <div class="body">
    <p class="eyebrow">MEASURED, NOT ASSUMED</p>
    <h1>김휘래 백엔드 개발 기록</h1>
    <p class="lead">정답이 하나가 아닌 자리에서 무엇을 고르고 무엇을 버렸는지,<br />그 근거를 직접 잰 숫자와 함께 적습니다.</p>
  </div>

  <div class="foot">
    <span>케이톡 · 레인보우TV · 아주이벤트 · 메일상자 · 아올다 클라우드</span>
    <span><b>40편</b></span>
  </div>
</body>
</html>
