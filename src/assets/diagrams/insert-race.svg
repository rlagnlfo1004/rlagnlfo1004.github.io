<svg class="diagram" viewBox="0 0 720 380" role="img" aria-label="SELECT FOR UPDATE 는 없는 행을 잠그지 못한다">
  <defs>
    <marker id="d1-a" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="var(--ink-3, #9A958B)" stroke-width="1.2"/>
    </marker>
    <marker id="d1-c" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0,0.5 L7,4 L0,7.5" fill="none" stroke="var(--clay, #BF5F3B)" stroke-width="1.2"/>
    </marker>
  </defs>

  <text x="0" y="14" font-size="13" font-weight="600" fill="var(--ink-2, #63605A)">두 이벤트가 같은 gmail_thread_id 로 동시에 진입</text>

  <!-- lanes -->
  <rect x="0"   y="34" width="326" height="250" rx="8" fill="var(--surface, #fff)" stroke="var(--rule, rgba(34,31,27,.11))" stroke-width="0.5"/>
  <rect x="394" y="34" width="326" height="250" rx="8" fill="var(--surface, #fff)" stroke="var(--rule, rgba(34,31,27,.11))" stroke-width="0.5"/>
  <text x="20"  y="60" font-size="12.5" font-weight="700" fill="var(--ink-3, #9A958B)">이벤트 A</text>
  <text x="414" y="60" font-size="12.5" font-weight="700" fill="var(--ink-3, #9A958B)">이벤트 B</text>

  <!-- time axis -->
  <line x1="360" y1="44" x2="360" y2="296" stroke="var(--rule-soft, rgba(34,31,27,.07))" stroke-width="0.5" stroke-dasharray="3 5"/>

  <!-- A: select -->
  <rect x="20" y="76" width="286" height="52" rx="6" fill="var(--sunk, #F1EDE3)" stroke="var(--rule-soft, rgba(34,31,27,.07))" stroke-width="0.5"/>
  <text x="36" y="97"  font-size="12.5" fill="var(--ink, #221F1B)">① SELECT ... FOR UPDATE</text>
  <text x="36" y="116" font-size="12" fill="var(--ink-2, #63605A)">결과 없음. 잠글 행이 존재하지 않는다</text>

  <!-- B: select -->
  <rect x="414" y="132" width="286" height="52" rx="6" fill="var(--sunk, #F1EDE3)" stroke="var(--rule-soft, rgba(34,31,27,.07))" stroke-width="0.5"/>
  <text x="430" y="153" font-size="12.5" fill="var(--ink, #221F1B)">② SELECT ... FOR UPDATE</text>
  <text x="430" y="172" font-size="12" fill="var(--ink-2, #63605A)">역시 없음. A 를 기다리지 않는다</text>

  <!-- A: insert -->
  <rect x="20" y="200" width="286" height="38" rx="6" fill="var(--sunk, #F1EDE3)" stroke="var(--rule-soft, rgba(34,31,27,.07))" stroke-width="0.5"/>
  <text x="36" y="224" font-size="12.5" fill="var(--ink, #221F1B)">③ INSERT  ·  커밋 성공</text>

  <!-- B: insert -->
  <rect x="414" y="242" width="286" height="38" rx="6" fill="var(--sunk, #F1EDE3)" stroke="var(--rule-soft, rgba(34,31,27,.07))" stroke-width="0.5"/>
  <text x="430" y="266" font-size="12.5" fill="var(--ink, #221F1B)">④ INSERT  ·  커밋 성공</text>

  <!-- flow -->
  <path d="M163,128 L163,196" fill="none" stroke="var(--ink-3, #9A958B)" stroke-width="1" marker-end="url(#d1-a)"/>
  <path d="M557,184 L557,238" fill="none" stroke="var(--ink-3, #9A958B)" stroke-width="1" marker-end="url(#d1-a)"/>
  <path d="M163,238 L163,318 L344,318" fill="none" stroke="var(--clay, #BF5F3B)" stroke-width="1.2" marker-end="url(#d1-c)"/>
  <path d="M557,280 L557,318 L376,318" fill="none" stroke="var(--clay, #BF5F3B)" stroke-width="1.2" marker-end="url(#d1-c)"/>

  <!-- result -->
  <text x="360" y="356" font-size="14" font-weight="700" fill="var(--clay, #BF5F3B)" text-anchor="middle">같은 스레드가 2건 생성된다</text>
  <text x="360" y="374" font-size="11.5" fill="var(--ink-3, #9A958B)" text-anchor="middle">PostgreSQL 15 · Read Committed · 30회 시도에서 30회 모두 발생</text>
</svg>
