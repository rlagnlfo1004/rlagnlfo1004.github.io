<svg class="diagram" viewBox="0 0 720 340" role="img" aria-label="중첩 순서에 따라 Circuit Breaker 가 세는 값이 달라진다">
  <text x="0" y="14" font-size="13" font-weight="600" fill="var(--ink-2, #63605A)">요청 1건에서 CircuitBreaker 가 기록하는 값</text>

  <!-- LEFT : CB outside -->
  <text x="0" y="46" font-size="12.5" font-weight="700" fill="var(--clay, #BF5F3B)">CB 바깥, Retry 안쪽</text>
  <text x="118" y="46" font-size="11.5" fill="var(--ink-3, #9A958B)">실제 코드</text>

  <rect x="0" y="58" width="326" height="164" rx="8" fill="none" stroke="var(--clay, #BF5F3B)" stroke-width="1"/>
