  <rect x="16" y="88" width="294" height="120" rx="6" fill="var(--sunk, #F1EDE3)" stroke="var(--rule, rgba(34,31,27,.11))" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="32" y="108" font-size="11.5" font-weight="700" fill="var(--ink-3, #9A958B)">Retry</text>

  <rect x="32" y="118" width="262" height="24" rx="4" fill="var(--surface, #fff)" stroke="var(--rule-soft, rgba(34,31,27,.07))" stroke-width="0.5"/>
  <text x="163" y="134" font-size="11.5" fill="var(--ink-2, #63605A)" text-anchor="middle">1회차 호출  ·  실패</text>
  <rect x="32" y="146" width="262" height="24" rx="4" fill="var(--surface, #fff)" stroke="var(--rule-soft, rgba(34,31,27,.07))" stroke-width="0.5"/>
  <text x="163" y="162" font-size="11.5" fill="var(--ink-2, #63605A)" text-anchor="middle">2회차 호출  ·  실패</text>
  <rect x="32" y="174" width="262" height="24" rx="4" fill="var(--surface, #fff)" stroke="var(--rule-soft, rgba(34,31,27,.07))" stroke-width="0.5"/>
